<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Task Out · 工作总览</title>
  <link rel="icon" href="icons/task-out32.png" type="image/png">
  <link rel="stylesheet" href="dashboard.css">
  <script src="core.js" defer></script>
  <script src="masonry.js" defer></script>
  <script src="archive-effects.js" defer></script>
  <script src="dashboard.js" defer></script>
</head>
<body>
  <main class="board-shell">
    <header class="board-header">
      <div><h1>Task Out</h1><p id="today" class="board-date"></p></div>
      <div class="toolbar-actions"><button data-action="settings" aria-label="打开设置"><span aria-hidden="true">⚙</span> 设置</button></div>
    </header>
    <section class="board-controls" aria-label="整理与筛选">
      <div class="control-line">
        <div class="segmented" aria-label="聚合方式"><button data-grouping="project" class="active">按项目</button><button data-grouping="source">按来源</button></div>
        <div id="organization-status" class="organization-status" role="status" aria-live="polite">正在读取整理状态…</div>
      </div>
      <div class="control-line secondary-line">
        <nav id="scopes" class="scope-tabs" aria-label="记录范围"><button data-scope="active" class="active">当前总览</button><button data-scope="recent">最近发起</button><button data-scope="saved">稍后查看</button><button data-scope="archived">已归档</button></nav>
      </div>
      <div class="search-line">
        <label class="search-box"><span aria-hidden="true">⌕</span><input id="query" type="search" placeholder="搜索标题、近况或标签" aria-label="搜索记录"></label>
        <details class="filter-menu"><summary>筛选</summary><div class="filter-panel">
        <select id="kind" aria-label="记录类型"><option value="all">全部内容</option><option value="web">网页</option><option value="session">会话</option></select>
        <select id="source" aria-label="来源"><option value="all">全部来源</option></select>
        <select id="project" aria-label="项目"><option value="all">全部项目</option></select>
        <select id="range" aria-label="对话时间" title="按最近更新时间筛选对话，网页全部保留；会话获取范围在连接来源中配置"><option value="3" selected>对话：近 3 天有更新</option><option value="7">对话：近 7 天有更新</option><option value="30">对话：近 30 天有更新</option><option value="0">对话：全部已获取</option></select>
        <select id="sort" aria-label="排序"><option value="updatedAt">最近活动优先</option><option value="createdAt">最近发起优先</option><option value="title">按标题排序</option></select>
        <label class="summary-switch"><input id="show-summaries" type="checkbox"> 显示一句近况</label>
        <button class="quiet" data-action="reset-filters">重置筛选</button>
        <div id="stats" class="stats-line"></div>
        </div></details>
      </div>
      <p id="view-hint" class="view-hint">近 3 天有更新的对话 · 全部已打开网页，时间筛选只影响对话</p>
      <div id="tags" class="tags-line" aria-label="类型标签"></div>
      <div id="migration" hidden></div>
      <div id="preview-notice" class="notice" hidden>当前是浏览器预览，可导入标准数据查看。安装 Chrome 扩展后可管理页签、保存整理结果和连接本机会话；预览数据仅在本页临时保存。</div>
    </section>
    <section class="board-content" aria-label="工作记录">
      <div class="section-heading"><h2 id="scope-title">当前总览</h2><div class="section-rule"></div><span id="item-count"></span></div>
      <details id="unassigned" class="unassigned-section" data-project-drop="" open hidden>
        <summary class="unassigned-heading">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 13 3-8h12l3 8v6H3v-6Z"/><path d="M3 13h5l2 3h4l2-3h5"/></svg>
          <span class="unassigned-label"><strong>未归类 <span id="unassigned-count"></span></strong><span>尚未加入项目</span></span>
          <span class="unassigned-toggle"><span class="when-open">收起</span><span class="when-closed">展开</span><span class="unassigned-chevron" aria-hidden="true">⌄</span></span>
        </summary>
        <p class="unassigned-hint">可拖入项目卡片，也可在详情中调整项目。</p>
        <div id="unassigned-items" class="unassigned-items" aria-label="未归类记录"></div>
      </details>
      <div id="board" class="project-grid" aria-live="polite"></div>
    </section>
    <footer class="board-footer"><span class="footer-brand">Task Out</span><span>给正在进行的事，一个清楚的位置。</span><span id="connection-state" class="connection-state" role="status">正在读取…</span></footer>
  </main>
  <dialog id="dialog" aria-labelledby="dialog-title"></dialog>
  <dialog id="detail" class="detail-dialog" aria-labelledby="detail-title"></dialog>
  <div id="toast" role="status" aria-live="polite" hidden></div>
</body>
</html>
